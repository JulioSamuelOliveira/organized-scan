spring.application.name=organized-scan

# =========================
# Datasource (Render)
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# =========================
# JPA / Flyway
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# Thymeleaf / Web
# =========================
spring.mvc.hiddenmethod.filter.enabled=true

# Respeitar cabeçalhos do proxy (Render) para evitar loop http↔https
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

# Cookies de sessão compatíveis com HTTPS atrás de proxy
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# =========================
# OAuth GitHub
# =========================
spring.security.oauth2.client.registration.github.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${CLIENT_SECRET}
# Use o redirect padrão do Spring (recomendado). Se quiser forçar explícito, descomente:
# spring.security.oauth2.client.registration.github.redirect-uri=https://organized-scan.onrender.com/login/oauth2/code/github
